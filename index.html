<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <script src="../js/page-effectif.js" type="module"></script>
    <title>Tachkila</title>
</head>

<body class="">

    <!-- start header -->
    <header>
        <div
            class="header-container flex justify-between items-center px-5 max-[767px]:p-1 h-[50px] bg-[#1E293B] border-b border-solid border-gray-500">
            <div class=" logo flex gap-2  items-center">
                <img src="img/logo.jpg" alt="logo" class="w-[30px] h-[30px] rounded-full">

                <p class="text-gray-50 font-bold ">TACHKILA</p>
            </div>

            <nav class="navbar h-[40px] flex items-center  ">
                <ul
                    class=" h-full w-[300px] flex flex-wrap items-center justify-around gap-1 rounded-xl bg-[#0F172A] shrink-1">
                    <li
                        class=" active text-xs flex self-center bg-[#1eba5f] rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 ">
                        <a href="index.html">Effectif</a>
                    </li>
                    <li class=" rounded-lg px-4 py-2 font-semibold text-xs hover:bg-slate-800">
                        <a href="composition.html">composition</a>
                    </li>
                    <li class="rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 text-xs">
                        <a href="matchs.html">matches</a>
                    </li>
                </ul>
            </nav>

            <div class="position-legend">
                <ul class="flex gap-2 max-[767px]:grid max-[767px]:grid-cols-2 max-[767px]:gap-1 ">
                    <li class="text-xs text-orange-400 flex gap-1">
                        <span class="w-2 h-2 bg-orange-400 rounded-full self-center"></span>GB
                    </li>
                    <li class="text-xs text-[#3AC8EF] flex gap-1">
                        <span class="w-2 h-2 bg-[#3AC8EF] rounded-full self-center"></span>DEF
                    </li>
                    <li class="text-xs text-[#20D244] flex gap-1">
                        <span class="w-2 h-2 bg-[#20D244] rounded-full self-center"></span>MIL
                    </li>
                    <li class="text-xs text-[#D75241] flex gap-1">
                        <span class="w-2 h-2 bg-[#D75241] rounded-full self-center"></span>ATT
                    </li>
                </ul>
            </div>

        </div>

    </header>
    <!-- end header -->
    <!-- start main section -->
    <main class="min-h-screen bg-[#0F172A] text-white">
        <div class="roster-page mx-auto flex max-w-[1600px] flex-col gap-6 px-4 py-6 md:px-8">
            <section class="header-effective flex shrink-1 justify-between">
                <div class="title">
                    <h2 class="font-bold text-3xl">Effectif</h2>
                    <p class="text-slate-400">Gerez les joueurs du club atlas FC</p>
                </div>
                <button type="button" id="add-player"
                    class="add-player-btn bg-[#1eba5f] text-gray-50 lg:w-[250px] lg:h-[30px] rounded-[10px] mt-[15px] mb-[10px] font-bold md:w-[400px]  md:self-center">
                    + Ajouter un joueur
                </button>

            </section>


            <!-- Recherche et filtres par poste -->
            <section
                class="players-area flex flex-col gap-3 rounded-2xl border border-slate-700 bg-[#1E293B] p-4 md:flex-row md:items-center">
                <div
                    class="player-search flex h-12 flex-1 items-center rounded-xl border border-slate-600 bg-[#0F172A] px-4">
                    <input type="search" id="search-player" name="search-player"
                        class="h-full w-full bg-transparent text-white outline-none placeholder:text-slate-500"
                        placeholder="Rechercher un joueur par nom...">
                </div>
                <div id="position-filters"
                    class="position-filters flex flex-wrap items-center justify-around gap-1 rounded-xl bg-[#0F172A] p-1">
                    <button type="button"
                        class="position-filter active rounded-lg bg-[#1eba5f] px-4 py-2 font-semibold text-xs hover:bg-slate-800">Tous</button>
                    <button type="button"
                        class="position-filter rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 text-xs">GB</button>
                    <button type="button"
                        class="position-filter rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 text-xs">DEF</button>
                    <button type="button"
                        class="position-filter rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 text-xs">MIL</button>
                    <button type="button"
                        class="position-filter rounded-lg px-3 py-2 font-semibold hover:bg-slate-800 text-xs">ATT</button>
                </div>
            </section>

            <!-- Liste des joueurs : -->
            <section id="player-list-effective" class="player-list grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4"
                aria-label="Liste des joueurs">
                <article
                    class="player-card-effective hidden relative rounded-2xl border border-l-4  bg-[#1E293B] p-5">
                    <span
                        class="captain-badge hidden absolute -right-2 -top-2 flex h-9 w-9 items-center justify-center rounded-full bg-purple-500 font-bold text-white">C</span>
                    <div class="player-card-header flex items-start gap-4">
                        <span
                            class="player-number-effective flex h-12 w-12 shrink-0 items-center justify-center rounded-full border-2  text-xl font-bold"></span>
                        <div class="player-details min-w-0">
                            <h2 class="player-name-effective text-lg font-bold text-white">Bono</h2>
                            <span
                                class="player-position-effective mt-1 rounded-md px-2.5 py-1 text-sm font-semibold">GB</span>
                        </div>
                    </div>
                    <p class="player-age mt-5 text-slate-400">Âge : <span id="player-age"> 29</span> ans</p>
                    <div class="player-card-footer mt-5 flex items-center justify-between gap-3">
                        <span
                            class="player-status rounded-md bg-emerald-500/20 text-emerald-300 px-2.5 py-1 text-sm font-semibold">En
                            forme</span>
                        <div class="player-actions flex items-center gap-3">
                            <button type="button"
                                class="captain-btn rounded-lg px-3 py-2 font-bold text-white text-xl hover:text-purple-500">C</button>
                            <button type="button" class="edit-player-btn p-2 text-slate-400 hover:text-white"><i
                                    class="fa-solid fa-pen" aria-hidden="true"></i></button>
                            <button type="button" class="delete-player-btn p-2 text-slate-400 hover:text-rose-400"><i
                                    class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
                        </div>
                    </div>
                </article>

            </section>

            <!-- Pagination -->
            <section class="pagination flex flex-col gap-4 pb-5 sm:flex-row sm:items-center sm:justify-between">
                <p id="players-count" class="players-count text-slate-400">Affichage de 8 sur 14 joueurs</p>
                <nav class="pagination-controls flex items-center justify-end gap-2">
                    <button type="button" id="previous-page"
                        class="pagination-btn rounded-lg border border-slate-700 px-4 py-2 font-bold text-slate-500"
                        disabled>Précédent</button>
                    <span id="page-count" class="page-count px-1 font-bold">Page 1 / 2</span>
                    <button type="button" id="next-page"
                        class="pagination-btn rounded-lg border border-slate-600 px-4 py-2 font-bold hover:bg-slate-800">Suivant</button>
                </nav>
            </section>

            <!-- POP UP -->
            <section id="popup"
                class="add-player-modal fixed inset-0 z-2 flex items-center justify-center bg-black/70 p-4 hidden ">
                <div class="  add-modal w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900 p-4">

                    <!-- Header -->
                    <div class="mb-6 flex items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-white">
                                Ajouter un joueur
                            </h2>

                        </div>

                        <button type="button" id="close-btn" aria-label="Fermer"
                            class="h-10 w-10 items-center justify-center rounded-lg bg-slate-800 text-xl text-white hover:bg-slate-700 ">
                            &times;
                        </button>
                    </div>

                    <!-- Form -->
                    <form id="addplayer" class="space-y-2 grid grid-cols-[1fr_1fr] grid-row-[1fr_1fr] gap-4">

                        <!-- Name -->
                        <div class="col-span-full">
                            <label for="name" class="mb-1 block text-sm font-medium text-slate-200">
                                Nom complet
                            </label>

                            <input type="text" id="name" name="name" placeholder="Ex. : Aya lamzoudi"
                                class="w-full rounded-xl border border-slate-700 bg-[#0F172A] px-4 py-2 text-white placeholder:text-slate-500 focus:border-cyan-400">

                            <p id="name-err" class="message mt-1 text-sm text-red-400"></p>
                        </div>

                        <!-- Position -->
                        <fieldset>
                            <legend class="mb-2 text-sm font-medium text-slate-200">
                                Poste
                            </legend>

                            <select
                                class="player-position-select w-[96%] m-auto border rounded-[10px] border-mist-700 bg-[#1E293B] px-4 py-2">
                                <option disabled selected value=""
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-checked:text-amber-300">
                                    choisez un poste
                                </option>
                                <option value="Gardien"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-checked:text-amber-300">
                                    Gardien
                                </option>
                                <option value="Defenseur"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-cyan-400 peer-checked:bg-cyan-400/10 peer-checked:text-cyan-300">
                                    Défenseur
                                </option>
                                <option value="Milieu"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-green-400 peer-checked:bg-green-400/10 peer-checked:text-green-300">
                                    Milieu
                                </option>
                                <option value="Attaquant"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-red-400 peer-checked:bg-red-400/10 peer-checked:text-red-300">
                                    Attaquant
                                </option>
                            </select>

                            <p id="flied-err" class="message mt-2 text-sm text-red-400"></p>
                        </fieldset>

                        <!-- Number -->
                        <div>
                            <label for="nbr" class="mb-1 text-sm font-medium text-slate-200">
                                Numéro (1 a 99):
                            </label>

                            <input type="number" id="nbr" name="nbr" placeholder="Ex : 10"
                                class="nbr-test w-full rounded-xl border border-slate-700 bg-[#0F172A] px-4 py-2 text-white placeholder:text-slate-500 focus:border-cyan-400">

                            <p id="nbr-err" class="message mt-1 text-sm text-red-400"></p>
                        </div>
                        <!-- age -->
                        <div>
                            <label for="age" class="mb-1 block text-sm font-medium text-slate-200">
                                age
                            </label>

                            <input type="number" id="age" name="age" placeholder="Ex. : 25 ans"
                                class="w-full rounded-xl border border-slate-700 bg-[#0F172A] px-4 py-2 text-white placeholder:text-slate-500 focus:border-cyan-400">

                            <p id="age-err" class="message mt-1 text-sm text-red-400"></p>
                        </div>
                        <!-- status -->
                        <fieldset>
                            <legend class="mb-2 text-sm font-medium text-slate-200">
                                status
                            </legend>

                            <select
                                class="player-status-select w-[96%] m-auto border rounded-[10px] px-4 py-2 border-mist-700 bg-[#1E293B]">
                               <option disabled selected value=""
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-checked:text-amber-300">
                                    choisez status de joueur
                                </option>
                                <option value="en-form"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-checked:text-amber-300">
                                    En forme
                                </option>
                                <option value="en-blesse"
                                    class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-[#0F172A] px-2 text-center text-sm text-slate-300  peer-checked:border-cyan-400 peer-checked:bg-cyan-400/10 peer-checked:text-cyan-300">
                                    En Blessé
                                </option>

                            </select>

                            <p id="status-err" class="message mt-2 text-sm text-red-400"></p>
                        </fieldset>
                        <!-- Actions -->
                        <div class="flex gap-3 pt-5 justify-end col-span-full">
                            <button type="reset" id="popup-cancel"
                                class="w-full rounded-xl border border-slate-700 px-5 py-3 font-medium text-slate-300 hover:bg-slate-800 sm:w-auto">
                                Annuler
                            </button>

                            <button type="submit" id="ajoute-btn"
                                class="add-btn w-full rounded-xl bg-[#20D244] px-6 py-3 font-semibold text-slate-950 transition hover:bg-[#4af66d] sm:w-auto">
                                Ajouter le joueur
                            </button>
                        </div>

                    </form>
                </div>
            </section>

            <!-- modifier pop up  -->


            <section id="update"
                class="edit-player fixed inset-0 z-2 flex items-center justify-center bg-black/70 p-4 hidden ">

                <div class="edit-modal w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900 p-4">

                    <!-- Header -->
                    <div class="mb-6 flex items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-white">
                                Modifier le joueur
                            </h2>
                        </div>

                        <button type="button" id="close-popup" aria-label="Fermer"
                            class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-800 text-xl text-white hover:bg-slate-700">
                            &times;
                        </button>
                    </div>

                    <!-- Form -->
                    <form id="updateplayer" class="space-y-2" novalidate>

                        <!-- Name -->
                        <div>
                            <label for="update-name" class="mb-2 block text-sm font-medium text-slate-200">
                                Nom complet
                            </label>

                            <input type="text" name="name" id="update-name" placeholder="Ex. : Aya Lamzoudi"
                                class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-2 text-white placeholder:text-slate-500 focus:border-cyan-400">

                            <p id="update-name-err" class="message mt-1 text-sm text-red-400 text-center"></p>
                        </div>

                        <!-- Position -->
                        <fieldset>
                            <legend class="mb-3 text-sm font-medium text-slate-200">
                                Poste
                            </legend>

                            <div id="update-poste" class="grid grid-cols-2 gap-2">

                                <label class="cursor-pointer">
                                    <input type="radio" name="poste" value="Gardien" class="peer sr-only">
                                    <span
                                        class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 px-2 text-center text-sm text-slate-300 peer-checked:border-amber-400 peer-checked:bg-amber-400/10 peer-checked:text-amber-300">
                                        Gardien
                                    </span>
                                </label>

                                <label class="cursor-pointer">
                                    <input type="radio" name="poste" value="Defenseur" class="peer sr-only">
                                    <span
                                        class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 px-2 text-center text-sm text-slate-300 peer-checked:border-cyan-400 peer-checked:bg-cyan-400/10 peer-checked:text-cyan-300">
                                        Défenseur
                                    </span>
                                </label>

                                <label class="cursor-pointer">
                                    <input type="radio" name="poste" value="Milieu" class="peer sr-only">
                                    <span
                                        class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 px-2 text-center text-sm text-slate-300 peer-checked:border-green-400 peer-checked:bg-green-400/10 peer-checked:text-green-300">
                                        Milieu
                                    </span>
                                </label>

                                <label class="cursor-pointer">
                                    <input type="radio" name="poste" value="Attaquant" class="peer sr-only">
                                    <span
                                        class="flex min-h-12 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 px-2 text-center text-sm text-slate-300 peer-checked:border-red-400 peer-checked:bg-red-400/10 peer-checked:text-red-300">
                                        Attaquant
                                    </span>
                                </label>

                            </div>

                            <p id="update-poste-err" class="message mt-2 text-sm text-red-400"></p>
                        </fieldset>

                        <!-- Number -->
                        <div>
                            <label for="update-nbr" class="mb-2 block text-sm font-medium text-slate-200">
                                Numéro (1 à 99)
                            </label>

                            <input type="number" name="number" id="update-nbr" placeholder="Ex. : 10"
                                class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-2 text-white placeholder:text-slate-500 focus:border-cyan-400">

                            <p id="update-nbr-err" class="message mt-1 text-sm text-red-400 text-center"></p>
                        </div>

                        <!-- Actions -->
                        <div class="flex justify-end gap-3 pt-5">
                            <button type="reset" id="update-annuler"
                                class="w-full rounded-xl border border-slate-700 px-5 py-3 font-medium text-slate-300 hover:bg-slate-800 sm:w-auto">
                                Annuler
                            </button>

                            <button type="submit" id="update-btn"
                                class="w-full rounded-xl bg-[#20D244] px-6 py-3 font-semibold text-slate-950  hover:bg-[#4af66d] sm:w-auto">
                                Enregistrer
                            </button>
                        </div>

                    </form>
                </div>
            </section>

            <!-- message de conformation -->
            <section id="confirm"
                class="supp hidden fixed inset-0 z-2 flex items-center justify-center bg-black/70 p-4  ">

                <div
                    class=" flex flex-col justify-center items-center w-full max-w-lg rounded-2xl border border-slate-700 bg-slate-900 p-4">

                    <!-- Header -->
                    <div class="mb-6 flex items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-white">
                                message de confirmation:
                            </h2>
                        </div>
                    </div>

                    <div id="confirmation" aria-labelledby="confirmText"
                        class=" w-max flex-col sm:flex-row items-center justify-between gap-4 rounded-2xl border-2 border-[#D75241] bg-[#03151bf2] px-6 py-4 shadow-2xl backdrop-blur-sm">
                        <p id="confirmText" class="font-semibold text-white"></p>
                        <div class="flex flex-wrap justify-center gap-3 text-[12px]">
                            <button id="cancelDelete" type="button"
                                class="rounded-xl bg-slate-700 px-5 py-2.5 font-semibold transition hover:bg-slate-600">Annuler</button>
                            <button id="confirmDelete" type="button"
                                class="rounded-xl bg-[#D75241] px-5 py-2.5 font-bold text-[#071018] transition hover:brightness-110">Supprimer</button>
                        </div>
                    </div>

                </div>
            </section>


        </div>

    </main>

    <!-- end main section -->

</body>

</html>
